[package]
name = "seismic-tee-network"
description = "Founder CLI for a Seismic network: provision a cohort, harvest its founding keys, assemble its identity"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The founder half is the only crate allowed to depend on both sides: founding
# a network is configuring and verifying each of its nodes, plus everything
# only Seismic does. Declared ahead of their first callers because the edges
# are the deliverable — see ../node/Cargo.toml.
seismic-tee-common.workspace = true
seismic-tee-node.workspace = true

seismic-manifest.workspace = true
seismic-measurement-admission.workspace = true
seismic-verify-quote.workspace = true

anyhow.workspace = true
clap.workspace = true
rustls.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "seismic-tee-network"
path = "src/main.rs"

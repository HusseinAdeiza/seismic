# The Rust deploy CLI: founding a Seismic network, and joining one.
#
# Provisioning is out of scope in both directions — neither CLI creates a
# machine or destroys one. The work spans both sides of a machine's existence:
# deriving the artifact set that is a network's identity needs no machine at
# all, while configuring a node and verifying its attestation needs one
# already running. The node descriptor is where those two halves meet, and it
# comes from the Pulumi program and the cohort helper beside it, for one node
# or N.
#
# The workspace is scoped to this directory rather than the repo root: deploy
# is a multi-purpose repo and this is one subsystem in it.
#
# Three crates, split by audience. The split is a rule about who may depend on
# whom, and here the compiler enforces it:
#
#   common   node descriptor, network-directory layout, HTTP and error types.
#            Depends on neither side.
#   node     -> seismic-tee-node, the operator CLI. Cloud-agnostic. Depends
#            only on common.
#   network  -> seismic-tee-network, the founder CLI. The only crate allowed
#            to depend on both.
#
# The whole workspace is headed for a public repo; the split is what keeps
# the operator half free of founder-only dependencies whichever way the
# binaries are cut.
[workspace]
resolver = "3"
members = [
    "common",  # -> seismic-tee-common  (library)
    "node",    # -> seismic-tee-node    (library + binary)
    "network", # -> seismic-tee-network (library + binary)
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/SeismicSystems/deploy"
authors = ["Seismic Systems"]

[workspace.dependencies]
seismic-tee-common = { path = "common" }
seismic-tee-node = { path = "node" }

# Enclave libraries, pinned by rev — the same mechanism seismic-reth uses for
# seismic-crypto. Every rule the network's identity depends on has exactly one
# implementation, and linking it rather than reimplementing it is what keeps
# deploy's answer and a node's answer the same answer.
seismic-network-manifest = { git = "https://github.com/SeismicSystems/enclave.git", rev = "6b35612a1844b370fac21525d035612e861372ee" }
seismic-manifest = { git = "https://github.com/SeismicSystems/enclave.git", rev = "6b35612a1844b370fac21525d035612e861372ee" }
seismic-measurement-admission = { git = "https://github.com/SeismicSystems/enclave.git", rev = "6b35612a1844b370fac21525d035612e861372ee" }
seismic-verify-quote = { git = "https://github.com/SeismicSystems/enclave.git", rev = "6b35612a1844b370fac21525d035612e861372ee" }
# The schema of the config POSTed to tdx-init, as the type tdx-init itself
# deserializes: a field it would reject fails to compile here.
tdx-init-config = { git = "https://github.com/SeismicSystems/enclave.git", rev = "6b35612a1844b370fac21525d035612e861372ee" }

# The 20- and 32-byte words the registry gate compares — genesis storage
# slots and the compile report's — and keccak256 over the registry's runtime
# code. Already in the graph through seismic-measurement-admission, whose
# report is typed in these; one copy, at the enclave's version.
alloy-primitives = { version = "1", default-features = false, features = ["std", "serde"] }
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
# The JSON-RPC client, for the attestation service's status reads. Already
# in the graph through seismic-verify-quote, which reaches the same port with
# it; the version must stay the enclave's so there is one copy. Only the HTTP
# client: this binary serves nothing and opens no websockets.
jsonrpsee = { version = "0.26", default-features = false, features = ["http-client"] }
# default-features off drops native-tls: an operator downloads one binary, so
# it must not link the host's OpenSSL.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
# The process-level crypto provider `tools verify` installs; see there.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
# The harvest's per-box nonce. At the enclave's version, like jsonrpsee.
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
# `preserve_order`: the reth genesis `assemble` re-emits with the registry
# storage injected keeps its authored key order, so a re-assembly diffs as the
# injection and nothing else. The manifest renderer sorts its own keys and
# does not depend on this.
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
# The terminal width the cohort dashboard truncates its rows to.
terminal_size = "0.4"
thiserror = "2.0"
# `signal` for ctrl-C during a node's first-boot watch, `time` for the polls,
# `process` for the foreign-repo shell-outs (`seismic-reth genesis-hash`,
# `summit genesis`), `sync` for the cohort dashboard's status channel.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "signal", "sync", "time"] }
toml = "0.9"

tempfile = "3"

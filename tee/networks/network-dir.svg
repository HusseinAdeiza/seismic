<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 980"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <style>
    text { fill: #374151; font-size: 13px; }
    .title    { font-size: 26px; font-weight: 700; fill: #1e40af; }
    .h2       { font-size: 20px; font-weight: 700; fill: #1e40af; }
    .subtitle { font-size: 13px; fill: #64748b; }
    .zonelabel { font-size: 14px; font-weight: 600; fill: #1e40af; }
    .caption, .edgelabel { font-size: 12px; fill: #64748b; }
    .edgelabel.green { fill: #047857; }
    .edgelabel.small { font-size: 11px; }
    /* node boxes: g.node.KIND groups positioned by translate(x,y); child rect + centered text */
    .node > rect { stroke-width: 2; }
    .node > text { text-anchor: middle; dominant-baseline: middle; }
    .authored  > rect { fill: #fed7aa; stroke: #c2410c; }
    .derived   > rect { fill: #93c5fd; stroke: #1e3a5f; }
    .derived   > text { fill: #1e3a5f; }
    .tool      > rect { fill: #3b82f6; stroke: #1e3a5f; }
    .tool      > text { fill: #ffffff; }
    .ephemeral > rect { fill: #dbeafe; stroke: #1e40af; stroke-dasharray: 6 4; }
    .ephemeral > text { fill: #1e40af; }
    .live      > rect { fill: #ddd6fe; stroke: #6d28d9; }
    .live      > text { fill: #6d28d9; }
    .endpoint > ellipse { fill: #a7f3d0; stroke: #047857; stroke-width: 2; }
    .endpoint > text { fill: #047857; text-anchor: middle; dominant-baseline: middle; font-size: 14px; }
    /* edges: solid = bytes flow, dashed = hash commitment */
    .flow { stroke: #1e3a5f; stroke-width: 2; fill: none; }
    .flow.green  { stroke: #047857; }
    .flow.purple { stroke: #6d28d9; }
    .pin  { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
    .zone { fill: none; stroke: #64748b; stroke-dasharray: 6 4; }
    .divider { stroke: #64748b; stroke-dasharray: 6 4; }
    .code-bg { fill: #1e293b; }
    .code { fill: #22c55e; font-size: 12px; }
  </style>
  <defs>
    <marker id="m-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1e3a5f"/>
    </marker>
    <marker id="m-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#047857"/>
    </marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <rect width="1620" height="980" fill="#ffffff"/>

  <!-- ================= header ================= -->
  <text class="title" x="40" y="52">Network directory: inputs/ → artifact set</text>
  <text class="subtitle" x="40" y="80">everything top-level is hash-pinned by network-manifest.json; everything under inputs/ is provenance</text>

  <!-- legend -->
  <g class="legend">
    <line class="flow" x1="1180" y1="40" x2="1224" y2="40"/>
    <text class="caption" x="1234" y="44">bytes flow</text>
    <line class="pin" x1="1180" y1="60" x2="1224" y2="60"/>
    <text class="caption" x="1234" y="64">hash commitment</text>
  </g>

  <!-- ================= section 1: manifest assemble ================= -->
  <!-- inputs/ zone: three authored files, one per row -->
  <rect class="zone" x="40" y="100" width="360" height="390" rx="8"/>
  <text class="zonelabel" x="56" y="126">inputs/ — authored; edit + re-assemble</text>
  <text class="zonelabel" x="440" y="126">manifest assemble</text>
  <text class="zonelabel" x="660" y="126">artifact set — derived, hash-pinned</text>

  <!-- row 1: measurements -->
  <g class="node authored" transform="translate(60,150)">
    <rect width="320" height="46" rx="8"/>
    <text x="160" y="24">inputs/measurements.json</text>
  </g>
  <text class="caption" x="65" y="216">raw PCR map from make measure</text>

  <!-- row 2: eth genesis -->
  <g class="node authored" transform="translate(60,260)">
    <rect width="320" height="46" rx="8"/>
    <text x="160" y="24">inputs/reth-genesis.json</text>
  </g>
  <text class="caption" x="65" y="326">policy-free genesis (reth dev template)</text>

  <!-- row 3: summit template -->
  <g class="node authored" transform="translate(60,370)">
    <rect width="320" height="46" rx="8"/>
    <text x="160" y="24">inputs/summit-genesis-template.toml</text>
  </g>
  <text class="caption" x="65" y="436">summit params; hash may be omitted</text>

  <!-- artifact set: same three rows, derived -->
  <g class="node derived" transform="translate(660,150)">
    <rect width="320" height="46" rx="8"/>
    <text x="160" y="24">measurement-policy.json</text>
  </g>
  <g class="node derived" transform="translate(660,260)">
    <rect width="320" height="46" rx="8"/>
    <text x="160" y="24">reth-genesis.json</text>
  </g>
  <g class="node derived" transform="translate(660,370)">
    <rect width="320" height="46" rx="8"/>
    <text x="160" y="24">summit-genesis-template.toml</text>
  </g>

  <!-- assemble arrows, one per row -->
  <line class="flow" x1="385" y1="173" x2="650" y2="173" marker-end="url(#m-dark)"/>
  <text class="edgelabel" x="413" y="166">promote (admission CLI)</text>
  <line class="flow" x1="385" y1="283" x2="650" y2="283" marker-end="url(#m-dark)"/>
  <text class="edgelabel" x="398" y="276">copy + inject registry storage</text>
  <line class="flow" x1="385" y1="393" x2="650" y2="393" marker-end="url(#m-dark)"/>
  <text class="edgelabel" x="398" y="386">fill validators = [] placeholder</text>

  <!-- intra-artifact edges -->
  <path class="flow green" d="M760 196 V255" marker-end="url(#m-green)"/>
  <text class="edgelabel green" x="772" y="230">compile → registry storage slots</text>
  <path class="pin" d="M700 306 V365" marker-end="url(#m-grey)"/>
  <text class="edgelabel" x="712" y="340">eth_genesis_hash</text>

  <!-- manifest: pure output, pins every artifact -->
  <g class="manifest">
    <rect x="1200" y="140" width="380" height="380" rx="8" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/>
    <text x="1220" y="172" font-size="16" font-weight="700" fill="#1e3a5f">network-manifest.json</text>
    <text class="caption" x="1220" y="194">pure output — never hand-edited</text>
    <rect class="code-bg" x="1218" y="206" width="344" height="296" rx="6"/>
    <!-- indentation via explicit tspan x (leading spaces collapse in XML) -->
    <text class="code" y="230">
      <tspan x="1232">{</tspan>
      <tspan x="1246" dy="18">"genesis_nonce": "0x..",  // fresh</tspan>
      <tspan x="1246" dy="18">"eth": {</tspan>
      <tspan x="1260" dy="18">"chain_id": 5124,</tspan>
      <tspan x="1260" dy="18">"genesis_hash": "0x.."</tspan>
      <tspan x="1246" dy="18">},</tspan>
      <tspan x="1246" dy="18">"summit": {</tspan>
      <tspan x="1260" dy="18">"genesis_template_hash": "0x..",</tspan>
      <tspan x="1260" dy="18">"namespace": ".."</tspan>
      <tspan x="1246" dy="18">},</tspan>
      <tspan x="1246" dy="18">"measurements": {</tspan>
      <tspan x="1260" dy="18">"bootstrap_policy_hash": "0x..",</tspan>
      <tspan x="1260" dy="18">"contracts": { reg, auth }</tspan>
      <tspan x="1246" dy="18">}</tspan>
      <tspan x="1232" dy="18">}</tspan>
    </text>
  </g>

  <!-- hash pins into the manifest -->
  <line class="pin" x1="985" y1="173" x2="1195" y2="173" marker-end="url(#m-grey)"/>
  <text class="edgelabel small" x="988" y="166">sha256 → bootstrap_policy_hash</text>
  <line class="pin" x1="985" y1="283" x2="1195" y2="283" marker-end="url(#m-grey)"/>
  <text class="edgelabel small" x="988" y="276">genesis-hash → eth.genesis_hash</text>
  <line class="pin" x1="985" y1="393" x2="1195" y2="393" marker-end="url(#m-grey)"/>
  <text class="edgelabel small" x="988" y="386">sha256 → genesis_template_hash</text>

  <!-- network_id = sha256(manifest bytes) -->
  <path class="pin" d="M1390 520 V547" marker-end="url(#m-grey)"/>
  <text class="edgelabel" x="1402" y="540">sha256(file bytes)</text>
  <g class="endpoint" transform="translate(1390,580)">
    <ellipse rx="150" ry="28"/>
    <text>network_id</text>
  </g>

  <!-- ================= section 2: genesis ceremony ================= -->
  <line class="divider" x1="40" y1="640" x2="1580" y2="640"/>
  <text class="h2" x="40" y="684">later, one-shot: genesis-ceremony</text>
  <text class="subtitle" y="708">
    <tspan x="40">builds the final summit genesis from live cohort keys;</tspan>
    <tspan x="40" dy="17">nothing is written back to the network directory</tspan>
  </text>

  <!-- committed template feeds the ceremony -->
  <path class="flow" d="M820 421 V690 L658 730" marker-end="url(#m-dark)"/>
  <text class="edgelabel" x="835" y="600">
    <tspan x="835">committed template copy</tspan>
    <tspan x="835" dy="16">sha256 re-checked vs manifest</tspan>
  </text>

  <g class="node live" transform="translate(60,740)">
    <rect width="320" height="46" rx="8"/>
    <text x="160" y="24">validators (TEE-born pubkeys)</text>
  </g>
  <text class="caption" x="65" y="810">gathered live from every node's summit</text>

  <g class="node tool" transform="translate(520,735)">
    <rect width="230" height="56" rx="8"/>
    <text x="115" y="29">summit genesis binary</text>
  </g>
  <text class="caption" x="525" y="815">-i template   -v validators</text>

  <g class="node ephemeral" transform="translate(870,735)">
    <rect width="250" height="56" rx="8"/>
    <text x="125" y="29">genesis.toml (tempdir)</text>
  </g>
  <text class="caption" x="875" y="815">ephemeral — delivered, never persisted</text>

  <g class="endpoint" transform="translate(1370,763)">
    <ellipse rx="145" ry="28"/>
    <text>POSTed to every node</text>
  </g>

  <line class="flow purple" x1="385" y1="763" x2="515" y2="763" marker-end="url(#m-purple)"/>
  <line class="flow" x1="755" y1="763" x2="865" y2="763" marker-end="url(#m-dark)"/>
  <line class="flow" x1="1125" y1="763" x2="1219" y2="763" marker-end="url(#m-dark)"/>
  <text class="edgelabel" x="1216" y="726" text-anchor="end">send_genesis (pre-genesis API)</text>

  <!-- footnote -->
  <text class="caption" x="60" y="930">nodes/ — gitignored runtime state beside the artifact set: descriptors, bootnodes.json</text>
</svg>
